<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>HISTIORY ARCHIVE</title>
        <link rel="stylesheet" href="css/default.css">
    </head>
    <body>
        
        <div id="header">
            <div class="inner">
                <a href="#" class="logo">HISTORY<span>ARCHIVE</span></a>
                <div class="header_search">
                    <input id="HeaderSearchInput" placeholder="사건, 키워드를 검색해주세요.">
                    <button id="HeaderSearchButton" >⌕</button>
                </div>
            </div>
        </div>
        
        <div id="visual">
            <div class="inner">
               <div class="visual_p">
                    <p class="eyebrow">2000~2025</p>
                    <h1>우리가 지나온<br><strong>사건들을 기록합니다.</strong></h1>
                    <p class="description">날짜와 시간의 흐름을 따라 지난 사건들을 탐색해보세요.</p>
               </div>
               <div class="visual_search">
                    <input id="VisualSearchInput" placeholder="사건, 키워드를 검색해주세요.">
                    <button id="VisualSearchButton" >검색</button>
                </div>
                
            </div>
        </div>
        
        
        
        <script src="js/default.js"></script>
    </body>
</html>
